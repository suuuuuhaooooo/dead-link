<script src="../../js/photos.js"></script>

<script>
Photos.draw(document.getElementById('cv'), '1129');
Side.send('photo', 'home-photo');
setTimeout(() => document.getElementById('w').classList.add('stare'), 5000);
setTimeout(() => { document.title = '……'; }, 15000);
setTimeout(() => { document.title = '你看到了嗎'; }, 22000);
</script>
